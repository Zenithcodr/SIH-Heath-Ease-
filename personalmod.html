<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Ease | Personal Details</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="personal" data-protected="true">
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">HE</div>
        <div>
          <h1>Health Ease</h1>
          <p>Patient console</p>
        </div>
      </div>
      <nav>
        <ul class="nav-list">
          <li><a data-link="dashboard" href="fumod.html">Dashboard</a></li>
          <li><a data-link="personal" href="personalmod.html">Personal Details</a></li>
          <li><a data-link="history" href="patienthistmod.html">Patient History</a></li>
          <li><a data-link="hospital" href="hospital.html">Hospital Finder</a></li>
          <li><a data-link="ambulance" href="ambulancebooking.html">Ambulance Booking</a></li>
          <li><a data-link="chatbot" href="chatbot.html">Health Chatbot</a></li>
          <li><a data-link="tips" href="healthtips.html">Health Tips & Queries</a></li>
        </ul>
      </nav>
      <button id="logoutBtn" class="danger" type="button">Logout</button>
      <div class="sidebar-meta"><div id="datetime"></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Personal Details</h2>
          <p>Saved locally and reused across all modules.</p>
        </div>
        <div class="badge" id="userTag">Guest</div>
      </header>

      <section class="panel">
        <form id="personalForm">
          <div class="input-grid">
            <label for="fullName">Full Name<input id="fullName" type="text" required></label>
            <label for="dob">Date of Birth<input id="dob" type="date" required></label>
            <label for="gender">Gender
              <select id="gender" required>
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label for="bloodGroup">Blood Group<input id="bloodGroup" type="text" placeholder="O+" required></label>
            <label for="phone">Phone<input id="phone" type="tel" required></label>
            <label for="emergencyContact">Emergency Contact<input id="emergencyContact" type="tel" required></label>
          </div>
          <label for="address">Address<textarea id="address" required></textarea></label>
          <label for="allergies">Known Allergies<textarea id="allergies" placeholder="Optional"></textarea></label>
          <button class="primary" type="submit">Save Details</button>
          <div id="personalMsg"></div>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
