<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Ease | Ambulance Booking</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="ambulance" data-protected="true">
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-badge">HE</div><div><h1>Health Ease</h1><p>Patient console</p></div></div>
      <nav>
        <ul class="nav-list">
          <li><a data-link="dashboard" href="fumod.html">Dashboard</a></li>
          <li><a data-link="personal" href="personalmod.html">Personal Details</a></li>
          <li><a data-link="history" href="patienthistmod.html">Patient History</a></li>
          <li><a data-link="hospital" href="hospital.html">Hospital Finder</a></li>
          <li><a data-link="ambulance" href="ambulancebooking.html">Ambulance Booking</a></li>
          <li><a data-link="chatbot" href="chatbot.html">Health Chatbot</a></li>
          <li><a data-link="tips" href="healthtips.html">Health Tips & Queries</a></li>
        </ul>
      </nav>
      <button id="logoutBtn" class="danger" type="button">Logout</button>
      <div class="sidebar-meta"><div id="datetime"></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Ambulance Booking</h2>
          <p>Raise and track emergency transport requests.</p>
        </div>
        <div class="badge" id="userTag">Guest</div>
      </header>

      <section class="panel" style="margin-bottom:14px;">
        <form id="ambulanceForm">
          <div class="input-grid">
            <label for="pickup">Pickup Location<input id="pickup" type="text" required></label>
            <label for="targetHospital">Target Hospital<input id="targetHospital" type="text" required></label>
            <label for="priority">Priority
              <select id="priority" required>
                <option value="Critical">Critical</option>
                <option value="Urgent">Urgent</option>
                <option value="Normal">Normal</option>
              </select>
            </label>
          </div>
          <button class="primary" type="submit">Request Ambulance</button>
          <div id="ambulanceMsg"></div>
        </form>
      </section>

      <section class="panel table-wrap">
        <table>
          <thead><tr><th>#</th><th>Pickup</th><th>Hospital</th><th>Priority</th><th>Status</th></tr></thead>
          <tbody id="ambulanceRows"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
