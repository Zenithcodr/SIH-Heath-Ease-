<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Ease | Chatbot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="chatbot" data-protected="true">
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-badge">HE</div><div><h1>Health Ease</h1><p>Patient console</p></div></div>
      <nav>
        <ul class="nav-list">
          <li><a data-link="dashboard" href="fumod.html">Dashboard</a></li>
          <li><a data-link="personal" href="personalmod.html">Personal Details</a></li>
          <li><a data-link="history" href="patienthistmod.html">Patient History</a></li>
          <li><a data-link="hospital" href="hospital.html">Hospital Finder</a></li>
          <li><a data-link="ambulance" href="ambulancebooking.html">Ambulance Booking</a></li>
          <li><a data-link="chatbot" href="chatbot.html">Health Chatbot</a></li>
          <li><a data-link="tips" href="healthtips.html">Health Tips & Queries</a></li>
        </ul>
      </nav>
      <button id="logoutBtn" class="danger" type="button">Logout</button>
      <div class="sidebar-meta"><div id="datetime"></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Health Chatbot</h2>
          <p>Simple advisory chatbot for quick healthcare guidance.</p>
        </div>
        <div class="badge" id="userTag">Guest</div>
      </header>

      <section class="panel">
        <div id="chatBox" class="chat-box"></div>
        <form id="chatForm">
          <label for="chatInput">Ask a health question
            <input id="chatInput" type="text" placeholder="Example: I have fever and headache" required>
          </label>
          <div style="display:flex;gap:10px;">
            <button class="primary" type="submit">Send</button>
            <button class="secondary" id="clearChat" type="button">Clear Chat</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
