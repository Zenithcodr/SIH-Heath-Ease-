<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Ease | Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
  <main class="auth-shell">
    <section class="auth-card">
      <aside class="auth-side">
        <div class="brand">
          <div class="brand-badge">HE</div>
          <div>
            <h1>Health Ease</h1>
            <p>Secure onboarding</p>
          </div>
        </div>
        <h2>Create an Account</h2>
        <p>
          Register as a patient or hospital user. Authentication is simulated with local storage
          so this project can run without a backend server.
        </p>
      </aside>
      <section class="auth-form">
        <h2>Sign Up</h2>
        <p>Fill in details to create your account.</p>
        <form id="signupForm">
          <div class="input-grid">
            <label for="sRole">Account Type
              <select id="sRole" required>
                <option value="patient">Patient</option>
                <option value="hospital">Hospital</option>
              </select>
            </label>
            <label for="sUsername">Username
              <input id="sUsername" type="text" placeholder="Unique username" required>
            </label>
            <label for="sFullName">Full Name
              <input id="sFullName" type="text" placeholder="Your name" required>
            </label>
            <label for="sEmail">Email
              <input id="sEmail" type="email" placeholder="you@example.com" required>
            </label>
            <label for="sPhone">Phone
              <input id="sPhone" type="tel" placeholder="10-digit phone" required>
            </label>
            <label for="sPassword">Password
              <input id="sPassword" type="password" placeholder="Min 6 chars" required>
            </label>
            <label for="sConfirm">Confirm Password
              <input id="sConfirm" type="password" placeholder="Re-enter password" required>
            </label>
          </div>
          <button class="primary" type="submit">Create Account</button>
          <div id="signupMsg"></div>
        </form>
        <p class="auth-switch">Already registered? <a href="login2.html">Login here</a></p>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
