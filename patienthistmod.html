<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Ease | Patient History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="history" data-protected="true">
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-badge">HE</div><div><h1>Health Ease</h1><p>Patient console</p></div></div>
      <nav>
        <ul class="nav-list">
          <li><a data-link="dashboard" href="fumod.html">Dashboard</a></li>
          <li><a data-link="personal" href="personalmod.html">Personal Details</a></li>
          <li><a data-link="history" href="patienthistmod.html">Patient History</a></li>
          <li><a data-link="hospital" href="hospital.html">Hospital Finder</a></li>
          <li><a data-link="ambulance" href="ambulancebooking.html">Ambulance Booking</a></li>
          <li><a data-link="chatbot" href="chatbot.html">Health Chatbot</a></li>
          <li><a data-link="tips" href="healthtips.html">Health Tips & Queries</a></li>
        </ul>
      </nav>
      <button id="logoutBtn" class="danger" type="button">Logout</button>
      <div class="sidebar-meta"><div id="datetime"></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Patient History</h2>
          <p>Track visits, diagnosis, and notes.</p>
        </div>
        <div class="badge" id="userTag">Guest</div>
      </header>

      <section class="panel" style="margin-bottom:14px;">
        <form id="historyForm">
          <div class="input-grid">
            <label for="visitDate">Visit Date<input id="visitDate" type="date" required></label>
            <label for="doctor">Doctor<input id="doctor" type="text" required></label>
            <label for="diagnosis">Diagnosis<input id="diagnosis" type="text" required></label>
          </div>
          <label for="notes">Clinical Notes<textarea id="notes" required></textarea></label>
          <button class="primary" type="submit">Add History Entry</button>
          <div id="historyMsg"></div>
        </form>
      </section>

      <section class="panel table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Date</th><th>Doctor</th><th>Diagnosis</th><th>Notes</th></tr>
          </thead>
          <tbody id="historyRows"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
